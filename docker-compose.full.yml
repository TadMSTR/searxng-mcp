# searxng-mcp full stack
#
# Wires all optional services: cache, Firecrawl + adblock sidecar, Crawl4AI,
# adblock-proxy (tiers 2+3), Ollama, Kiwix, and NATS. Requires SearXNG running
# externally (see SEARXNG_URL).
#
# Network isolation (NE-02):
#   fetch-net    — adblock-proxy + crawl4ai only; proxy unreachable from unrelated services
#   firecrawl-net — firecrawl-api + firecrawl-redis + firecrawl-playwright
#   (default)    — cache, ollama, reranker, kiwix, nats; isolated from proxy
#
# Prerequisites:
#   - Kiwix: download ZIM files to ./kiwix-data/ before starting kiwix service.
#     See https://download.kiwix.org/ — recommended: wikipedia_en_all_maxi,
#     stackoverflow_en_all, archlinux_en_all
#   - Ollama: pull required models after first start:
#       docker exec ollama ollama pull qwen3:4b
#       docker exec ollama ollama pull qwen3:14b
#   - NATS: update NATS_CREDS path if using credential-based auth.

# Pinned so the project name comes from this file rather than from whatever
# the clone directory happens to be called. Compose project names are global to
# the Docker host, and a directory-derived one silently shares a namespace with
# any other stack of the same name — `down` in one removes the other's
# containers. vikunja#694.
# Container hardening (vikunja#693). Every setting below was verified by
# RUNNING the service, not by reading the diff — each row of the matrix was
# probed against a green no-hardening baseline first, because a comparison
# whose control is already failing tells you nothing. Two findings a diff read
# would have missed are recorded at their services: `cache` needs two
# capabilities back, and three services need a writable /tmp.

name: searxng-mcp

services:
  # ── Cache backend (Redis-compatible) ────────────────────────────────────────
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # Alternatives (drop-in compatible):
    #   image: redis:7-alpine
    #   image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Dragonfly's entrypoint drops privileges with setpriv, so a bare
    # `cap_drop: [ALL]` kills it at startup with
    # "setpriv: setresuid failed: Operation not permitted" (exit 127).
    # Verified: ALL alone fails, ALL + SETUID/SETGID runs. This is the finding
    # that would have broken every adopter's cache had the block been applied
    # from a diff read.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:6381:6379"
    # --proactor_threads is not optional on a large host: Dragonfly sizes its
    # io threads to the core count and then refuses to start if maxmemory is
    # below 256MiB per thread. On a 32-core machine this exact command line
    # exits with "There are 32 threads, so 8.00GiB are required" before any
    # hardening is involved. Found by running it (vikunja#693).
    command: ["--proactor_threads=4", "--maxmemory=2gb", "--save_schedule="]
    ulimits:
      memlock: -1

  # ── Firecrawl (tier-1 JS-render fetch) ──────────────────────────────────────
  # Firecrawl requires its own Redis instance and the playwright-service sidecar.
  # See https://docs.firecrawl.dev/self-hosting for full setup.
  firecrawl-api:
    image: ghcr.io/mendableai/firecrawl:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: NOT verified. This image is not published under a tag
    # that could be started without API keys, so it was never run under the
    # hardening. Absent rather than guessed — see the note at the top.
    mem_limit: 2g
    cpus: 2.0
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3003
      USE_DB_AUTHENTICATION: "false"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright
    networks:
      - firecrawl-net

  firecrawl-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # redis:7-alpine drops privileges with setpriv, exactly like Dragonfly, so
    # a bare `cap_drop: [ALL]` restart-loops it on
    # "setpriv: setresuid failed: Operation not permitted".
    #
    # This was initially recorded as verified against `redis:alpine` — a
    # DIFFERENT image (redis 8, different entrypoint) that happens to be the
    # one present on the build host. It passed, and the tag this file actually
    # declares did not. Every probe below is now run against the exact
    # reference in this file.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - firecrawl-net

  firecrawl-playwright:
    # Custom build: ghcr.io/firecrawl/playwright-service + EasyList/EasyPrivacy
    # via @ghostery/adblocker-playwright. See docker/playwright-adblock/README.md
    # — and read its SSRF note before changing the route handler.
    #
    # Replaces the former puppeteer-based service, which layered adblocking onto
    # the v1 renderer (trieve/puppeteer-service-ts). This repo defaults to
    # FIRECRAWL_API_VERSION=v2, whose renderer is the playwright service — so
    # tier-1 adblocking did not apply to the configuration this project actually
    # runs (vikunja#696). docker/puppeteer-adblock/ is kept for adopters still on
    # v1 and is marked v1-only in its README.
    #
    # NOTE: the port is 3003, not 3000 — the two renderers differ.
    build:
      context: ./docker/playwright-adblock
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: not verified — Chromium writes outside /tmp. Left off
    # rather than guessed.
    mem_limit: 2g
    cpus: 2.0
    environment:
      # ADBLOCK_FILTERS_URL is deliberately unset: the filter lists are baked
      # into the image, and setting this opts back into fetching them at
      # runtime — the switch defeated by its own default.
      # Set ADBLOCK_DISABLE=true to disable adblocking for debugging.
      ADBLOCK_DISABLE: "${ADBLOCK_DISABLE:-false}"
    networks:
      - firecrawl-net

  # ── Adblock proxy (tiers 2+3 HTTP proxy filter) ────────────────────────────
  # Routes Crawl4AI and raw Node fetch through a @ghostery/adblocker HTTP proxy.
  # Plain-HTTP ad/tracker requests are blocked with an empty 200 response.
  # HTTPS CONNECT is tunneled without MITM — see docker/adblock-proxy/README.md.
  # On fetch-net only — unreachable from firecrawl, ollama, reranker, kiwix, nats.
  # Port 8118 exposed to host so searxng-mcp (PM2/host process) can reach it.
  adblock-proxy:
    build:
      context: ./docker/adblock-proxy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Verified running fully read-only.
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8118:8118"
    environment:
      ADBLOCK_FILTERS_URL: "https://easylist.to/easylist/easylist.txt,https://easylist.to/easylist/easyprivacy.txt"
      ADBLOCK_REFRESH_HOURS: "168"
      LOG_BLOCKED: "false"
    networks:
      - fetch-net

  # ── Crawl4AI (tier-2 fetch fallback) ────────────────────────────────────────
  crawl4ai:
    image: unclecode/crawl4ai:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NO `read_only`. Three configurations were run, and none is fit for a file
    # adopters copy:
    #
    #   read_only + tmpfs /tmp
    #       gunicorn worker crash-loops to FATAL —
    #       OSError: [Errno 30] Read-only file system: '/home/appuser/.crawl4ai'
    #   read_only + tmpfs /tmp,/home/appuser/.crawl4ai
    #       healthy and serving, but still logs a read-only error for
    #       '/home/appuser/.gunicorn'
    #   read_only + tmpfs /tmp,/home/appuser
    #       no read-only errors at all, and the service is unhealthy and
    #       unreachable — masking the home directory hides something it needs
    #
    # Chasing writable paths one exception at a time is how you end up with a
    # container that logs clean and serves nothing, which is the third case.
    #
    # Note the first configuration reports `running` for roughly 30 seconds
    # before gunicorn gives up retrying. An earlier pass recorded it as
    # verified on a 12-second wait: "running" is not "working".
    mem_limit: 4g
    cpus: 4.0
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ""  # Set to protect your instance
    shm_size: "1gb"
    networks:
      - fetch-net

  # ── Ollama (query expansion + summarization) ─────────────────────────────────
  # Required models: qwen3:4b (expand), qwen3:14b (summarize)
  # Pull after start: docker exec ollama ollama pull qwen3:4b && docker exec ollama ollama pull qwen3:14b
  ollama:
    image: ollama/ollama:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NO `read_only`, and not for lack of trying: verified failing both with
    # and without a tmpfs /tmp. Ollama writes outside /tmp, which is what the
    # ollama-data volume is for. This is the service the plan had in mind when
    # it said read_only is not a blanket addition.
    mem_limit: 8g
    cpus: 4.0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Reranker (ML cross-encoder reranking) ────────────────────────────────────
  # This repo's own reranker: CPU-only, no API key, model baked into the image
  # so there is no cold start. Source and contract in docker/reranker/.
  #
  # Alternatives, if you would rather run something else on port 8787:
  #   - Jina Reranker: docker pull jinaai/jina-reranker-v2-base-multilingual
  #   - Infinity with a cross-encoder model: https://github.com/michaelfeil/infinity
  #   - Any service exposing a Jina-compatible /v1/rerank
  reranker:
    image: ghcr.io/tadmstr/searxng-mcp-reranker:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # To build from source instead of pulling:
    # build: ./docker/reranker
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Matches docker/reranker/docker-compose.yml, which carries the same block
    # and the reasoning behind the tmpfs (FlashRank's default cache_dir).
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    ports:
      # Loopback-only: the reranker has no authentication.
      - "127.0.0.1:8787:8787"
    environment:
      - RERANKER_MODEL=ms-marco-MiniLM-L-12-v2

  # ── Kiwix (offline Wikipedia / Stack Overflow / Arch Wiki) ──────────────────
  # Requires ZIM files in ./kiwix-data/ — see https://download.kiwix.org/
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: NOT verified. kiwix-serve needs a .zim corpus to start
    # and there was none to test against, so the probe never had a green
    # baseline to compare to. Unverified is left off, not assumed safe.
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8292:8080"
    volumes:
      - ./kiwix-data:/data
    command: /data/*.zim

  # ── NATS (event publishing) ──────────────────────────────────────────────────
  # Optional: set NATS_URL=nats://localhost:4222 in searxng-mcp env to enable.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Verified: read_only alone exits 1, read_only + a writable /tmp runs.
    # JetStream has no volume here so it uses temporary storage under /tmp and
    # says so on startup — fine for the reference stack, not for a deployment
    # that needs the stream to survive a restart.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:4222:4222"
    command: ["-js"]
    # For credential-based auth, mount a config file:
    # volumes:
    #   - ./nats.conf:/etc/nats/nats.conf:ro
    # command: ["-c", "/etc/nats/nats.conf"]

  # ── Hister (optional — browsing-history fast path) ──────────────────────────
  # Hister is a separate service (a browser-extension-fed history index), not
  # shipped in this compose. Run it separately, then point searxng-mcp at it via
  # HISTER_URL / HISTER_TOKEN (below). When both are set, fetch_url queries
  # Hister before the tier cascade and serves login-walled / JS-heavy pages
  # already rendered by the browser extension. Leave unset to disable (zero
  # overhead). See README "Hister (optional)".

networks:
  fetch-net:
  firecrawl-net:

volumes:
  ollama-data:

# ── MCP client configuration ──────────────────────────────────────────────────
#
# Full env block for your MCP client config (all services wired):
#
#   SEARXNG_URL             http://localhost:8081
#   CACHE_URL               redis://localhost:6381
#   FIRECRAWL_URL           http://localhost:3002
#   FIRECRAWL_API_KEY       placeholder-local
#   CRAWL4AI_URL            http://localhost:11235
#   RERANKER_URL            http://localhost:8787
#   OLLAMA_URL              http://localhost:11434
#   OLLAMA_EXPAND_MODEL     qwen3:4b
#   OLLAMA_SUMMARIZE_MODEL  qwen3:14b
#   EXPAND_QUERIES          false
#   KIWIX_URL               http://localhost:8292
#   WAYBACK_ENABLED         false
#   ADBLOCK_PROXY_URL       http://localhost:8118
#   NATS_URL                nats://localhost:4222
#   HISTER_URL              http://localhost:4434   # optional — browsing-history fast path
#   HISTER_TOKEN            <bearer token>          # optional — required when HISTER_URL is set
#   CACHE_TTL_SECONDS       3600
#   FETCH_CACHE_TTL_SECONDS 86400
#   RERANK_RECENCY_WEIGHT   0.15
