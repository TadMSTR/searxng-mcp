name: Publish container image

# Same trigger as release.yml, so the image and the npm package are cut from
# one tag and cannot drift apart (vikunja#681).
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/tadmstr/searxng-mcp
  # Not bare `reranker`: this lands in a shared namespace alongside every other
  # package, and a rename after publication is worse than a long name.
  RERANKER_IMAGE: ghcr.io/tadmstr/searxng-mcp-reranker
  PROXY_IMAGE: ghcr.io/tadmstr/searxng-mcp-adblock-proxy
  PLAYWRIGHT_ADBLOCK_IMAGE: ghcr.io/tadmstr/searxng-mcp-playwright-adblock

jobs:
  publish:
    name: Build, smoke test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance attestation, matching the `npm publish --provenance`
      # posture release.yml already has.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # linux/amd64 only. arm64 would need QEMU emulation on this runner, which
      # roughly triples the job for a platform with no consumer today. Add it
      # when something actually needs it, not speculatively.
      #
      # Built with plain docker, and loaded into the local daemon rather than
      # pushed. That is what lets the smoke test below run against the exact
      # image this job will push — a build-then-rebuild-to-push would test one
      # artefact and publish another.
      - name: Build image
        run: docker build -t "$IMAGE:candidate" .

      # The gate. Identical assertions to ci.yml's docker job, run here before
      # anything is pushed, because a published image is the thing consumers
      # pull — CI having been green on some earlier commit is not the same
      # claim. Deliberately duplicated rather than factored out: a shared
      # script that silently stopped running would leave both jobs green.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          docker run -d --name sxng-publish -p 127.0.0.1:3001:3001 \
            -e SEARXNG_MCP_AUTH_TOKEN="$TOKEN" "$IMAGE:candidate"

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          mcp() {
            code -X POST http://127.0.0.1:3001/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' "$@"
          }

          # 503 is expected — there is no cache backend here. This only asserts
          # the route answers at all.
          for i in $(seq 1 30); do
            health=$(code http://127.0.0.1:3001/health || true)
            case "$health" in 200|503) break ;; esac
            if [ "$i" = 30 ]; then
              echo "server never came up"; docker logs sxng-publish; exit 1
            fi
            sleep 1
          done

          echo "GET /health (no credentials) -> $health"
          case "$health" in 200|503) ;; *) exit 1 ;; esac

          unauth=$(mcp -d '{}')
          echo "POST /mcp (no credentials) -> $unauth"
          [ "$unauth" = 401 ]

          wrong=$(mcp -H 'Authorization: Bearer not-the-token' -d '{}')
          echo "POST /mcp (wrong token) -> $wrong"
          [ "$wrong" = 401 ]

          ok=$(mcp -H "Authorization: Bearer $TOKEN" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}')
          echo "POST /mcp (correct token) -> $ok"
          [ "$ok" = 200 ]

          uid=$(docker exec sxng-publish id -u)
          echo "runtime uid -> $uid"
          [ "$uid" = 1000 ]

      - name: Container logs
        if: always()
        run: docker logs sxng-publish || true

      # The token arrives through `env`, not `${{ }}` interpolation into the
      # script body. Interpolation splices the secret into the shell text the
      # runner executes, which puts it in reach of anything that reads the
      # rendered command; via env it stays a variable. `--password-stdin` for
      # the same reason on the argv side — a `--password <token>` would put it
      # in the process table.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Both `v3.24.0` and `3.24.0` are published, deliberately. The git tag
      # carries the `v`; the conventional Docker tag does not; and
      # docker/metadata-action's {{version}} silently strips it. Publishing a
      # documented `v`-prefixed tag that then does not exist is a real failure
      # mode this fleet has already hit once. Publishing both removes the
      # question rather than answering it.
      #
      # `latest` moves only for a plain release tag. A prerelease (v3.24.0-rc1)
      # publishes its own tags and leaves `latest` where it was.
      - name: Tag and push
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF_NAME#v}"                      # 3.24.0        (or 3.24.0-rc1)
          MINOR="$(echo "$V" | cut -d. -f1,2)"   # 3.24

          # Exact tags always. The FLOATING tags — :3.24 and :latest — move only
          # for a plain release: someone pinned to :3.24 is asking for the
          # newest stable 3.24.x, and quietly handing them an rc is the kind of
          # surprise a floating tag exists to avoid.
          TAGS=("$REF_NAME" "$V")
          case "$V" in
            *-*) echo "prerelease $V — publishing exact tags only, not :$MINOR or :latest" ;;
            *)   TAGS+=("$MINOR" "latest") ;;
          esac

          for t in "${TAGS[@]}"; do
            echo "pushing $IMAGE:$t"
            docker tag "$IMAGE:candidate" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

          # The digest of what was actually pushed, for the attestation below.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$V" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest $DIGEST"

      # `push-to-registry: true` WORKS — do not remove it on the strength of a
      # 404 from the referrers API. GHCR does not implement
      # GET /v2/<name>/referrers/<digest>; it returns 404 MANIFEST_UNKNOWN even
      # for a digest that exists and carries an attestation. GHCR uses the OCI
      # spec's fallback tag scheme instead, publishing the referrers index under
      # a tag named `sha256-<digest>`.
      #
      # vikunja#689 reported "referrers=0" on both published images and
      # concluded this line was a no-op. It is not: verified 2026-09-06, both
      # images at v3.25.0 and v3.25.1 carry a sigstore bundle with predicateType
      # https://slsa.dev/provenance/v1 under their fallback tag. The zero came
      # from querying an endpoint GHCR does not serve — a failed query reported
      # as an empty answer, which is the same defect class as the rest of this
      # release. See docs/deployment.md for how to read it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A sibling job rather than more steps in `publish`: it is a different image
  # with a different contract, and keeping it separate means a reranker failure
  # names itself instead of appearing as "the publish job broke". It shares the
  # release tag, because the reranker is versioned by the repo that vendors it
  # (vikunja#692).
  publish-reranker:
    name: Build, smoke test, publish reranker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # amd64 only, consistent with the main image.
      - name: Build reranker image
        run: docker build -t "$RERANKER_IMAGE:candidate" ./docker/reranker

      # Asserts the CONTRACT, not the boot. A reranker that starts and returns
      # the documents in the order it received them passes any liveness check
      # while silently doing nothing — which is the exact failure this service
      # degrades into, since searxng-mcp falls back to SearXNG's ordering when
      # reranking is absent and says so only in a throttled log line.
      - name: Smoke test the reranker image
        run: |
          set -euo pipefail

          # --network none is the assertion that the model is genuinely baked
          # into the image. If the pre-bake ever silently stops working, the
          # container cannot reach the download and this step fails here rather
          # than becoming a 30-60s cold start in production.
          docker run -d --name rr-publish --network none "$RERANKER_IMAGE:candidate"

          for i in $(seq 1 30); do
            if docker exec rr-publish python -c "
          import urllib.request, json, sys
          sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8787/health'))['model_loaded'] else 1)
          " 2>/dev/null; then break; fi
            if [ "$i" = 30 ]; then
              echo "reranker never became ready"; docker logs rr-publish; exit 1
            fi
            sleep 1
          done
          echo "model_loaded true with no network — the model is baked in"

          docker exec rr-publish python -c "
          import urllib.request, json, sys
          body = json.dumps({
              'query': 'how do I train a dog',
              'documents': [
                  'Bananas are a yellow fruit that grows in tropical climates.',
                  'Puppy obedience training uses positive reinforcement and short daily sessions.',
              ],
              'return_documents': True,
          }).encode()
          req = urllib.request.Request(
              'http://127.0.0.1:8787/v1/rerank', data=body,
              headers={'Content-Type': 'application/json'})
          d = json.load(urllib.request.urlopen(req))

          results = d['results']
          print('results:', json.dumps(results, indent=2))

          # The relevant document is index 1, so a service that preserved input
          # order — i.e. reranked nothing — fails here.
          assert results[0]['index'] == 1, 'not reordered: reranking is a no-op'
          assert results[0]['relevance_score'] > results[1]['relevance_score'], 'scores not ordered'
          assert all('relevance_score' in r for r in results), 'missing relevance_score'
          assert len(results) == 2, 'documents lost'
          print('rerank contract OK')
          "

          # Request bounds. Asserted here because they are a property of the
          # published artefact, not of the compose file that happens to bind it
          # to loopback — an adopter can front this image however they like.
          docker exec rr-publish python -c "
          import urllib.request, urllib.error, json

          def post(payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  'http://127.0.0.1:8787/v1/rerank', data=body,
                  headers={'Content-Type': 'application/json'})
              try:
                  return urllib.request.urlopen(req).status
              except urllib.error.HTTPError as e:
                  return e.code

          # The real caller's measured shape must be unaffected: the live
          # SearXNG feeding this sends ~30 documents of ~430 chars.
          real = {'query': 'q', 'documents': ['title. ' + 'x' * 420 for _ in range(34)]}
          assert post(real) == 200, 'the real caller shape was rejected'

          assert post({'query': 'q', 'documents': ['d'] * 1000}) == 200, 'cap is too tight'
          assert post({'query': 'q', 'documents': ['d'] * 1001}) == 422, 'document cap not enforced'
          assert post({'query': 'q' * 20001, 'documents': ['d']}) == 422, 'query cap not enforced'
          # Oversized documents truncate rather than reject.
          assert post({'query': 'q', 'documents': ['x' * 50000]}) == 200, 'long document should truncate'
          print('request bounds OK')
          "

          uid=$(docker exec rr-publish id -u)
          echo "runtime uid -> $uid"
          [ "$uid" = 10001 ]

      - name: Reranker logs
        if: always()
        run: docker logs rr-publish || true

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Same tag policy as the main image, for the same reasons: both `v`-
      # prefixed and bare tags, and floating tags that do not move for a
      # prerelease.
      - name: Tag and push reranker
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF_NAME#v}"
          MINOR="$(echo "$V" | cut -d. -f1,2)"

          TAGS=("$REF_NAME" "$V")
          case "$V" in
            *-*) echo "prerelease $V — publishing exact tags only, not :$MINOR or :latest" ;;
            *)   TAGS+=("$MINOR" "latest") ;;
          esac

          for t in "${TAGS[@]}"; do
            echo "pushing $RERANKER_IMAGE:$t"
            docker tag "$RERANKER_IMAGE:candidate" "$RERANKER_IMAGE:$t"
            docker push "$RERANKER_IMAGE:$t"
          done

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$RERANKER_IMAGE:$V" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest $DIGEST"

      # vikunja#689 was a misdiagnosis and is resolved: provenance IS attached.
      # GHCR does not serve the OCI referrers API, it uses the spec's fallback
      # tag (sha256-<digest>). See docs/deployment.md and the note on the main
      # image's attest step. Do not remove push-to-registry over a 404.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RERANKER_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── adblock-proxy ───────────────────────────────────────────────────────────
  # The last stack component without a published image (vikunja#697). Until now
  # the reference deployment built it from an absolute path into a developer's
  # working tree, which is not an adoption path.
  publish-adblock-proxy:
    name: Build, smoke test, publish adblock-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build adblock-proxy image
        run: docker build -t "$PROXY_IMAGE:candidate" ./docker/adblock-proxy

      # Asserts the CONTRACT, not the boot. A proxy that starts and forwards
      # everything unfiltered passes any liveness check while doing none of the
      # job it exists for — and nothing downstream would notice, because an
      # unblocked ad is indistinguishable from an ad that was never requested.
      # Asserts the CONTRACT, not the boot. A proxy that starts and forwards
      # everything unfiltered passes any liveness check while doing none of the
      # job it exists for — and nothing downstream notices, because an
      # unblocked ad is indistinguishable from an ad that was never requested.
      #
      # Every assertion below was run against a real build before being written
      # here, and the first draft was WRONG in a way worth recording: it used a
      # local nginx origin and http://doubleclick.net/ad.js. Both are refused by
      # ssrf.js — the container origin resolves to a private address, and this
      # host's resolver blackholes ad domains to `::` — so BOTH returned zero
      # bytes and the "is it blocking ads?" assertion passed for every URL,
      # blocked or not. It proved nothing.
      #
      # Hence: a public origin for the forwarding case, a URL EasyList actually
      # matches for the blocking case, and an assertion on WHICH mechanism the
      # log reports, because "empty response" alone cannot tell an adblock hit
      # from an SSRF refusal.
      - name: Smoke test the adblock-proxy image
        run: |
          set -euo pipefail

          docker network create smoke-net >/dev/null
          docker run -d --name smoke-proxy --network smoke-net \
            -e LOG_BLOCKED=true "$PROXY_IMAGE:candidate" >/dev/null

          for i in $(seq 1 60); do
            if docker logs smoke-proxy 2>&1 | grep -q 'listening on'; then break; fi
            if [ "$i" = 60 ]; then echo "proxy never became ready"; docker logs smoke-proxy; exit 1; fi
            sleep 1
          done
          docker logs smoke-proxy

          via() {
            docker run --rm --network smoke-net curlimages/curl:latest \
              -s -o /dev/null -w '%{http_code} %{size_download}' -m 25 \
              --proxy http://smoke-proxy:8118 "$@"
          }

          # 1. A normal plain-HTTP URL proxies through, WITH a body. The body
          #    size is the point: every failure mode below also yields 0 bytes,
          #    so without a known non-zero case the other assertions are vacuous.
          read -r code size <<<"$(via http://example.com/)"
          echo "forwarding: HTTP $code, $size bytes"
          [ "$code" = "200" ] || { echo "FAIL: proxy did not forward"; exit 1; }
          [ "$size" -gt 0 ] || { echo "FAIL: forwarded response was empty"; exit 1; }

          # 2. A URL EasyList actually matches gets the documented empty 200.
          #    NOT doubleclick.net/ad.js — EasyList does not match that bare
          #    path, and it is DNS-blackholed here anyway.
          read -r code size <<<"$(via http://www.googletagmanager.com/gtm.js)"
          echo "adblock: HTTP $code, $size bytes"
          [ "$code" = "200" ] || { echo "FAIL: blocked URL should be an empty 200, got $code"; exit 1; }
          [ "$size" = "0" ] || { echo "FAIL: blocked URL returned a body"; exit 1; }
          docker logs smoke-proxy 2>&1 | grep -q 'blocked http://www.googletagmanager.com/gtm.js' \
            || { echo "FAIL: no adblock log line — something else produced that empty 200"; exit 1; }

          # 3. HTTPS CONNECT tunnels.
          read -r code size <<<"$(via https://example.com/)"
          echo "CONNECT: HTTP $code, $size bytes"
          [ "$code" = "200" ] || { echo "FAIL: CONNECT tunnel did not work"; exit 1; }

          # 4. ssrf.js refuses an internal target. Asserted on the ARTEFACT,
          #    because this image is about to be published into topologies its
          #    author did not choose, and a mitigation that lives only in one
          #    compose file does not ship with the image (vikunja#697).
          read -r code size <<<"$(via http://127.0.0.1:22/ || echo '000 0')"
          echo "internal target: HTTP $code"
          [ "$code" = "403" ] || { echo "FAIL: internal address not refused with 403, got $code"; exit 1; }
          docker logs smoke-proxy 2>&1 | grep -q 'refused non-public target 127.0.0.1' \
            || { echo "FAIL: no SSRF refusal log line"; exit 1; }

          echo "adblock-proxy contract OK — forwards, adblocks, tunnels, and refuses internal targets"
          docker rm -f smoke-proxy >/dev/null
          docker network rm smoke-net >/dev/null

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Tag and push adblock-proxy
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF_NAME#v}"
          MINOR="$(echo "$V" | cut -d. -f1,2)"

          TAGS=("$REF_NAME" "$V")
          case "$V" in
            *-*) echo "prerelease $V — publishing exact tags only, not :$MINOR or :latest" ;;
            *)   TAGS+=("$MINOR" "latest") ;;
          esac

          for t in "${TAGS[@]}"; do
            echo "pushing $PROXY_IMAGE:$t"
            docker tag "$PROXY_IMAGE:candidate" "$PROXY_IMAGE:$t"
            docker push "$PROXY_IMAGE:$t"
          done

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$PROXY_IMAGE:$V" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest $DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.PROXY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── playwright-adblock ──────────────────────────────────────────────────────
  # Tier-1 adblocking for Firecrawl v2's renderer (vikunja#696). Same shape as
  # the jobs above; the smoke test is the one that differs, because this image
  # sits in front of a security control.
  publish-playwright-adblock:
    name: Build, smoke test, publish playwright-adblock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # THE ASSERTION THAT MATTERS IS NOT "ARE ADS BLOCKED".
      #
      # This image installs a request interceptor in front of Firecrawl's
      # in-browser SSRF guard. A handler calling route.continue() instead of
      # route.fallback() deletes that guard while still blocking ads, still
      # rendering pages, and still returning 200 — so the script builds a
      # deliberately broken variant and asserts the signal DISAPPEARS. Without
      # that control, a test that always passes looks identical to one that
      # works.
      #
      # It builds the image itself, so there is no separate build step here.
      - name: Build and verify playwright-adblock (SSRF guard survives)
        run: ./docker/playwright-adblock/verify-ssrf-guard.sh "$PLAYWRIGHT_ADBLOCK_IMAGE:candidate"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Tag and push playwright-adblock
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF_NAME#v}"
          MINOR="$(echo "$V" | cut -d. -f1,2)"

          TAGS=("$REF_NAME" "$V")
          case "$V" in
            *-*) echo "prerelease $V — publishing exact tags only, not :$MINOR or :latest" ;;
            *)   TAGS+=("$MINOR" "latest") ;;
          esac

          for t in "${TAGS[@]}"; do
            echo "pushing $PLAYWRIGHT_ADBLOCK_IMAGE:$t"
            docker tag "$PLAYWRIGHT_ADBLOCK_IMAGE:candidate" "$PLAYWRIGHT_ADBLOCK_IMAGE:$t"
            docker push "$PLAYWRIGHT_ADBLOCK_IMAGE:$t"
          done

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$PLAYWRIGHT_ADBLOCK_IMAGE:$V" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest $DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.PLAYWRIGHT_ADBLOCK_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
