# Secret scanning — the gate, and the scan that finds what the gate was too late for.
#
# .gitleaks.toml has sat at the repo root for months with NOTHING running it
# (repo-conform B14). The repo therefore looked covered and was not: a config file
# is a statement of intent, and only a workflow makes it a gate.
#
# Its own workflow rather than a job in ci.yml, matching codeql.yml and
# scorecard.yml — because it needs a `schedule:` trigger of its own, and putting
# one on ci.yml would run the whole build weekly to get it.
#
# TWO JOBS, AND THE SECOND IS THE ONE THAT GETS DROPPED.
#
#   tree     every push and PR, working tree only. Stops a new secret landing.
#   history  weekly, full history. Finds one that already did.
#
# The second is not a slower version of the first. A credential in public git
# history survives deletion of the commit that introduced it — the incident behind
# this requirement is five room IDs leaked into the public history of the matrix
# repos, where removing the commit changed nothing because the objects were already
# fetched and mirrored. Once that has happened the only remedy is rotation, and you
# cannot rotate what you do not know about. So `history` is detection, not
# prevention, and its value is entirely in telling you to go rotate something.
#
# `history` needs `fetch-depth: 0`. The default checkout depth is 1, which scans
# one commit and reports green on a repository whose history is full of secrets —
# a gate that cannot fail, dressed as a full-history scan.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays 03:23 UTC. Offset from codeql.yml (04:17) and scorecard.yml (05:41)
    # so the three do not contend for runners, and on an odd minute rather than
    # :00, which is when everyone else's cron fires.
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    name: Working tree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Prove the scanner and this repo's own rules can fail
        run: ./.github/scripts/gitleaks-selftest.sh

      # `dir` rather than `git`: asserts that nothing in the tree we ship holds a
      # secret. History is the other job's business.
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

  history:
    name: Full history
    runs-on: ubuntu-latest
    # Scheduled and manual only. On a PR it would scan main's history, which the
    # PR did not change — a slow way to re-learn the same thing every time, and
    # a red that the PR author cannot fix.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # THE WHOLE POINT OF THIS JOB. At the default depth of 1 this scans one
          # commit and passes, which is indistinguishable from a clean history.
          fetch-depth: 0

      # Installed again rather than shared from the job above: jobs get separate
      # runners, so nothing the `tree` job put on PATH exists here. Worth saying
      # explicitly — a tool that happens to be present on one runner is how a
      # per-job dependency becomes invisible.
      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Prove the scanner and this repo's own rules can fail
        run: ./.github/scripts/gitleaks-selftest.sh

      - name: Scan full history
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose
