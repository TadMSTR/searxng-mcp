# CodeQL static analysis.
#
# Free here because the repository is public — CodeQL requires a GitHub Advanced
# Security licence only on private repositories.
#
# TWO languages, and the second is the less obvious one:
#   javascript-typescript  the src/ and tests/ tree
#   actions                the workflow files themselves. This repo has five
#                          workflows that between them hold a GHCR token, an npm
#                          publish token, and `packages: write` — a scriptable
#                          surface worth scanning in its own right. Adding CI
#                          without scanning CI is how injection into a workflow
#                          `run:` block goes unnoticed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly. A scheduled run is not redundant with the push/PR triggers: CodeQL
    # ships new queries, so code that was clean when it landed can become a
    # finding without anyone touching it. Sunday 04:17 UTC — an off-peak minute
    # rather than :00, which is when everyone else's cron fires.
    - cron: "17 4 * * 0"

# Least privilege at the top level; the analyse job adds only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      # Actions are pinned by commit SHA, matching ci.yml and
      # docker-publish.yml. A mutable tag on a third-party action is a supply
      # chain hole: the tag can be repointed at any commit after review, and
      # these jobs hold `security-events: write`.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is a superset of the default suite. This is a
          # small codebase and the extra queries are worth the runtime.
          queries: security-and-quality

      # No build step. CodeQL analyses TypeScript from source without one, and
      # `pnpm build` here would only add a way for the analysis to fail for
      # reasons unrelated to the code. ci.yml already gates the build.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
