name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Without a top-level `permissions:` block GitHub
# hands the job whatever the repository default is, which is broader than any
# job here needs — OSSF Scorecard's Token-Permissions check scored this repo
# 0/10 on exactly that, naming all three of ci.yml, release.yml and
# docker-publish.yml (measured 2026-09-07, scorecard v5.3.0). Jobs that need
# more declare it themselves at the job level, where it is visible next to the
# step that uses it.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Coverage
        if: matrix.node-version == '22'
        run: pnpm coverage

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Plain `docker build` rather than docker/build-push-action: buildx ships
      # on the runner, nothing is pushed, and this adds no third-party action to
      # pin. Without this job the Dockerfile rots the way the compose examples
      # did — nothing exercised them on a PR.
      - name: Build image
        run: docker build -t searxng-mcp:ci .

      # A green build only proves it compiled. These assert the two properties
      # the containerised deployment actually depends on: /health answers with
      # no credentials, and /mcp refuses everything without the bearer token.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          docker run -d --name sxng-ci -p 127.0.0.1:3001:3001 \
            -e SEARXNG_MCP_AUTH_TOKEN="$TOKEN" searxng-mcp:ci

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          mcp() {
            code -X POST http://127.0.0.1:3001/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' "$@"
          }

          # 503 is expected — there is no cache backend in CI. What is asserted
          # here is only that the route answers at all.
          for i in $(seq 1 30); do
            health=$(code http://127.0.0.1:3001/health || true)
            case "$health" in 200|503) break ;; esac
            if [ "$i" = 30 ]; then
              echo "server never came up"; docker logs sxng-ci; exit 1
            fi
            sleep 1
          done

          echo "GET /health (no credentials) -> $health"
          case "$health" in 200|503) ;; *) exit 1 ;; esac

          unauth=$(mcp -d '{}')
          echo "POST /mcp (no credentials) -> $unauth"
          [ "$unauth" = 401 ]

          wrong=$(mcp -H 'Authorization: Bearer not-the-token' -d '{}')
          echo "POST /mcp (wrong token) -> $wrong"
          [ "$wrong" = 401 ]

          ok=$(mcp -H "Authorization: Bearer $TOKEN" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}')
          echo "POST /mcp (correct token) -> $ok"
          [ "$ok" = 200 ]

          # The deployment relies on the image not running as root.
          uid=$(docker exec sxng-ci id -u)
          echo "runtime uid -> $uid"
          [ "$uid" = 1000 ]

      - name: Container logs
        if: always()
        run: docker logs sxng-ci || true

  # ── playwright-adblock ──────────────────────────────────────────────────────
  # A separate job, not a step in `docker` above, so a failure here reads as
  # "the adblock sidecar broke" rather than "the image build broke". They are
  # different images with different failure modes.
  playwright-adblock:
    name: playwright-adblock (reproducible build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The filter lists are vendored (vikunja#716), so NOTHING in this build may
      # contact easylist.to.
      #
      # Asserting that with `--network none` would be the wrong test, and it is
      # worth saying why: the `npm ci` step in this Dockerfile genuinely needs the
      # npm registry, so an offline build fails for a reason that has nothing to
      # do with the property under test — it would be red whether or not the
      # vendoring worked. Blackholing exactly one host is the scoped assertion. It
      # fails if anything reaches easylist.to and passes only because nothing
      # does. Verified two-sided before it was committed: the pre-vendoring
      # Dockerfile FAILS this build, this one passes.
      #
      # This gate is the reason the property stays true. The v3.28.0 release
      # failed on the old build-time fetch and needed a re-run, and this image
      # sits in front of a real security control (verify-ssrf-guard.sh) — a build
      # that flakes for unrelated network reasons is how a genuine guard failure
      # gets re-run past.
      - name: Builds without reaching easylist.to
        run: |
          set -euo pipefail
          docker build --add-host easylist.to:127.0.0.1 \
            -t playwright-adblock:ci docker/playwright-adblock/

      # A green build only proves the checksums matched. This asserts the lists
      # are actually RULES — the failure this whole subsystem exists to prevent
      # is an adblocker reporting success while blocking nothing, and a file that
      # passes `sha256sum -c` can still be a list nobody can parse.
      #
      # The two `allowed` cases are the control. Without them a blocker that
      # matched everything would look identical to one that works.
      - name: Baked lists produce a working engine
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh playwright-adblock:ci -c '
            cd /usr/src/app/adblock && node -e "
              const fs = require(\"node:fs\"), path = require(\"node:path\");
              const { PlaywrightBlocker } = require(\"@ghostery/adblocker-playwright\");
              const { Request } = require(\"@ghostery/adblocker\");
              const d = \"/usr/src/app/adblock/lists\";
              const files = fs.readdirSync(d).filter((f) => f.endsWith(\".txt\")).sort();
              if (files.length === 0) throw new Error(\"no filter lists in the image\");
              const text = files.map((f) => fs.readFileSync(path.join(d, f), \"utf8\")).join(\"\\n\");
              const b = PlaywrightBlocker.parse(text);
              // Both blocked URLs correspond to rules present in EasyPrivacy
              // (||adservice.google. and ||google.com/gen_204?). If upstream ever
              // drops them this goes red, which is the correct outcome: it means
              // the assertion no longer describes the shipped lists.
              const cases = [
                [\"https://adservice.google.com/pagead.js\", true],
                [\"https://www.google.com/gen_204?x=1\", true],
                [\"https://example.com/app.js\", false],
                [\"https://cdn.jsdelivr.net/npm/x.js\", false],
              ];
              let bad = 0;
              for (const [url, want] of cases) {
                const got = b.match(Request.fromRawDetails({
                  type: \"script\", url, sourceUrl: \"https://news.example.org/\",
                })).match;
                console.log((got ? \"BLOCKED\" : \"allowed\") + \"  \" + url);
                if (got !== want) { console.error(\"  ^ expected \" + (want ? \"BLOCKED\" : \"allowed\")); bad++; }
              }
              if (bad) throw new Error(bad + \" filter-list assertion(s) failed\");
              console.log(\"engine OK: \" + files.length + \" list(s), \" + cases.length + \" assertions\");
            "
          '

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable

      # Audit `pnpm-lock.yaml` — the tree the Docker image is actually built
      # from. This job used to run `npm install --package-lock-only` and audit
      # *that*, which re-resolves every dependency from the semver ranges in
      # package.json. It therefore reported on "what a fresh install would get
      # today", a tree that ships nowhere: it read undici 7.29.0 and passed
      # green while the deployed container ran 7.28.0 with four highs. No
      # --audit-level value could have caught that — the threshold picks which
      # findings fail, not which tree is read. See vikunja#633.
      #
      # The npm detour existed because npmjs.org 410'd the endpoints `pnpm
      # audit` used (SXNG-15 / vikunja#145). That premise is dead: pnpm audit
      # returns real findings and real exit codes against the real lockfile.
      #
      # No --audit-level, which means pnpm's default: `low`. The tree is clean
      # at that setting, so a threshold has nothing to suppress and would only
      # hide the next version drift. If an advisory ever lands with no fix in
      # range, add a narrow, dated, ticket-referenced `--ignore <CVE>` for that
      # one advisory — do not raise the threshold. `--ignore-registry-errors`
      # is deliberately absent too: a registry outage should be visible here,
      # not silently green.
      #
      # No `pnpm install` step: audit reads the lockfile directly. The lockfile
      # is kept honest by the `test` job's `pnpm install --frozen-lockfile`,
      # which fails if it has drifted from package.json.
      - name: Audit dependencies
        run: pnpm audit --prod

      # The dev tree, gated separately and deliberately so (vikunja#634).
      #
      # `--prod` above covers what ships. Nothing covered the build and test
      # tooling, and that gap was not theoretical: vite carried
      # GHSA-fx2h-pf6j-xcff (high, server.fs.deny bypass) and
      # GHSA-v6wh-96g9-6wx3 under vitest while CI stayed green for ten
      # releases. A dev-only advisory does not reach a user, but it does reach
      # every maintainer's workstation and this runner.
      #
      # A SEPARATE step, not `--prod` widened to the whole tree. Folding them
      # together changes what a single red gate means: "something we ship is
      # vulnerable" and "something we build with is vulnerable" warrant
      # different responses and different urgency, and a merged step would make
      # the first indistinguishable from the second.
      #
      # Same threshold reasoning as the step above — pnpm's default, no
      # --audit-level. If a dev advisory lands with no fix in range, this step
      # will block merges; take a narrow, dated, ticket-referenced `--ignore
      # <CVE>` rather than raising the threshold or deleting the step.
      - name: Audit dev dependencies
        run: pnpm audit --dev

      # The two docker/ sub-projects are NOT in the pnpm workspace, so neither
      # step above sees them — and both are built into PUBLISHED images, one of
      # them an unauthenticated forward proxy. A CVE in @ghostery/adblocker
      # would have shipped silently (audit LOW, 2026-09-06).
      #
      # A THIRD step rather than folding these into the two above, for the same
      # reason --prod and --dev are separate: "something we publish in a
      # container is vulnerable" is a different question from "something in the
      # npm package is", and merging them makes the first invisible.
      #
      # `npm ci --package-lock-only` then `npm audit` reads the committed
      # lockfile without installing. If a lockfile has drifted from its
      # package.json, `npm ci` fails here — which is the point: the previous
      # Dockerfiles used `npm install <caret-range>` and re-resolved on every
      # build, so nothing pinned what actually shipped.
      - name: Audit container sub-project dependencies
        run: |
          set -euo pipefail
          for d in docker/adblock-proxy docker/playwright-adblock; do
            echo "::group::$d"
            ( cd "$d" && npm ci --package-lock-only --no-audit --no-fund && npm audit --omit=dev )
            echo "::endgroup::"
          done
