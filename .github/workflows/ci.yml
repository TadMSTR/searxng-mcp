name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Coverage
        if: matrix.node-version == '22'
        run: pnpm coverage

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Plain `docker build` rather than docker/build-push-action: buildx ships
      # on the runner, nothing is pushed, and this adds no third-party action to
      # pin. Without this job the Dockerfile rots the way the compose examples
      # did — nothing exercised them on a PR.
      - name: Build image
        run: docker build -t searxng-mcp:ci .

      # A green build only proves it compiled. These assert the two properties
      # the containerised deployment actually depends on: /health answers with
      # no credentials, and /mcp refuses everything without the bearer token.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          docker run -d --name sxng-ci -p 127.0.0.1:3001:3001 \
            -e SEARXNG_MCP_AUTH_TOKEN="$TOKEN" searxng-mcp:ci

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          mcp() {
            code -X POST http://127.0.0.1:3001/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' "$@"
          }

          # 503 is expected — there is no cache backend in CI. What is asserted
          # here is only that the route answers at all.
          for i in $(seq 1 30); do
            health=$(code http://127.0.0.1:3001/health || true)
            case "$health" in 200|503) break ;; esac
            if [ "$i" = 30 ]; then
              echo "server never came up"; docker logs sxng-ci; exit 1
            fi
            sleep 1
          done

          echo "GET /health (no credentials) -> $health"
          case "$health" in 200|503) ;; *) exit 1 ;; esac

          unauth=$(mcp -d '{}')
          echo "POST /mcp (no credentials) -> $unauth"
          [ "$unauth" = 401 ]

          wrong=$(mcp -H 'Authorization: Bearer not-the-token' -d '{}')
          echo "POST /mcp (wrong token) -> $wrong"
          [ "$wrong" = 401 ]

          ok=$(mcp -H "Authorization: Bearer $TOKEN" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}')
          echo "POST /mcp (correct token) -> $ok"
          [ "$ok" = 200 ]

          # The deployment relies on the image not running as root.
          uid=$(docker exec sxng-ci id -u)
          echo "runtime uid -> $uid"
          [ "$uid" = 1000 ]

      - name: Container logs
        if: always()
        run: docker logs sxng-ci || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      # npmjs.org retired the audit endpoints `pnpm audit` depends on (410,
      # even on latest pnpm) — npm's own audit already speaks the new bulk
      # advisory endpoint, so generate a throwaway lockfile from package.json
      # and audit with that instead. See SXNG-15.
      - name: Generate npm lockfile for audit
        run: npm install --package-lock-only

      # Fail only on high+ advisories. A moderate, Windows-only serve-static
      # path-traversal in @hono/node-server <2.0.5 (GHSA-frvp-7c67-39w9) is
      # pulled in transitively by @modelcontextprotocol/sdk, which pins
      # ^1.19.9 — no patched version exists in range, and the vulnerable code
      # path isn't used (Linux deploy; node:http transport, not hono
      # serve-static). Revisit when the SDK bumps hono to 2.x. Tracked: vikunja#218.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
