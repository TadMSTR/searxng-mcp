# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit review configuration — forge.
#
# Deliberately minimal. Every key here is a standing claim about how forge wants its code
# reviewed, and an over-configured reviewer is harder to reason about than a default one.
# Add a key only when a default has actually cost a build something.

reviews:
  pre_merge_checks:
    docstrings:
      # Disabled, not lowered.
      #
      # forge puts the rationale for a piece of code in a block comment above the thing it
      # explains — the table, the guard, the constant — rather than in a per-function
      # docstring. The docstring-coverage check reads that as missing documentation. It
      # fired on both part-1 PRs of agent-build-workflow-2026-09 and was declined both
      # times for this same reason, costing two hand-written rebuttals in PR comments.
      # Settled here rather than re-argued per build.
      #
      # This turns off a *coverage metric*, not review of documentation. CodeRabbit still
      # comments on docstrings that are wrong, stale or misleading — which is the failure
      # mode forge actually has.
      #
      # QUOTED DELIBERATELY. YAML 1.1 parses a bare `off` as the boolean false, which is
      # not a member of this field's string enum (`off`/`warning`/`error`) — the value is
      # rejected and the check silently reverts to its `warning` default.
      mode: "off"

  # Exclusions only — deliberately no positive pattern. `path_filters` doubles as a
  # sparse-checkout spec, and adding an include (`src/**`) would turn this list into
  # an allowlist that silently drops every path not named.
  path_filters:
    # 145 KB and append-only. Every line in it describes a change that was already
    # reviewed when it landed, so re-reading it per PR buys nothing and spends the
    # review's context budget on the one file guaranteed to contain no defect.
    - "!CHANGELOG.md"
    # Generated. Dependabot arrives with the resolution already decided, and the
    # useful review of a bump is of the manifest range, not the resolved tree.
    - "!pnpm-lock.yaml"
    # Build and test output, regenerated by `pnpm build` / `pnpm test`.
    - "!coverage/**"
    - "!build/**"

  path_instructions:
    - path: ".github/workflows/**"
      instructions: |
        An action reference is pinned to a full 40-character commit SHA followed by a
        `# vX.Y.Z` version comment. Both halves are required and neither is
        decoration: repo-conform attribute F7 asserts the version comment, and it is
        the only human-readable form of the pin. Do not suggest collapsing a SHA pin
        to a tag or a major-version ref, and do not suggest dropping the comment.

        An action appearing in more than one workflow must resolve to the SAME SHA in
        every one of them. CI asserts this. The reason is vikunja#920: commit 76c9969
        added a new workflow and a new ci.yml job with pre-bump SHAs hand-copied in,
        which re-introduced three pins Dependabot had already bumped and re-opened two
        PRs that had already merged. Nothing caught it, because per-file the pins
        looked fine.

        `github/codeql-action/init`, `/analyze` and `/upload-sarif` are distinct action
        paths that must nonetheless share one SHA. CodeQL aborts the run on a
        mismatched init/analyze pair, so a bump that moves one and not the others is
        not a partial improvement — it is a broken workflow.

        Long explanatory comments in these files are house style, not clutter. They
        name the ticket, incident or measurement a gate exists to prevent. Do not
        suggest shortening or removing them.

    - path: "src/**/*.ts"
      instructions: |
        `SECURITY[accepted]` and `SECURITY[control]` comments mark decisions a security
        audit already reviewed and signed off. `[accepted]` is a risk taken knowingly,
        with the reasoning stated inline; `[control]` names the mitigation that makes a
        nearby `[accepted]` tolerable. Treat both as settled. Raise one only if the
        surrounding code has changed such that the stated reasoning no longer holds —
        and say specifically which part no longer holds.

        Every outbound fetch to a caller-influenced or discovered URL goes through
        `safeFetch` (`fetch-utils.ts`), which layers `assertPublicUrl` over a
        DNS-validating undici dispatcher that re-checks each redirect hop. Flag any new
        fetch path that bypasses it. The configured internal services — SearXNG,
        Firecrawl, Crawl4AI, Ollama, the reranker — are intentionally exempt.

        A telemetry span must wrap work actually performed, not a call site merely
        traversed. A `withSpan` opened *before* a guard clause that can return early
        yields a span count measuring traversals, which reads as traffic: this is how
        a completely inert fast path went unnoticed for months (vikunja#640,
        vikunja#643). Flag a span opened outside the guard it belongs behind.
