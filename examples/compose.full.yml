# ── RUNG 4 of 4 — full ────────────────────────────────────────────────────────
#
# EVERYTHING. Rung 3 plus Firecrawl (with its own Redis and an adblocking
# renderer), an adblock proxy for tiers 2-3, Ollama, Kiwix and NATS.
#
#   Containers   12
#   RAM          ~24 GB total — Ollama alone is capped at 8g and wants more
#   GPU          optional, but you want one for Ollama (see the deploy: block)
#   Disk         ~20 GB of images, plus models and any ZIM corpus you download
#
# THIS RUNG IS NOT A RECOMMENDATION. It is the reference topology — the one that
# proves every tier and fast path works together. Most adopters should stop at
# rung 2 or 3. Run this if you want PDFs, LLM summarisation, offline Wikipedia,
# or you are developing against the fetch cascade itself.
#
# WHAT CHANGES FROM RUNG 3
#   `search_and_summarize`   now works — Ollama synthesises a cited summary.
#                            Below rung 4 it returns fetched pages behind an
#                            explicit `summarization unavailable` marker.
#   PDFs                     now fetchable — Firecrawl v2 serves them; no other
#                            tier does
#   `crawl_site`             now uses Firecrawl's real crawl, not the sitemap/BFS
#                            fallback
#   Wikipedia / Stack Overflow / Arch Wiki
#                            served locally from Kiwix, before the cascade runs
#   ad and tracker filtering both on tier 1 (in-renderer) and tiers 2-3 (proxy)
#   Wayback                  tier-4 archived-snapshot fallback, enabled here
#   NATS                     a JetStream event per search and fetch
#
# THE CAPABILITY LINE THIS RUNG PRINTS — measured 2026-09-07:
#
#   capabilities on=tier3,wayback unverified=tier1,tier2,cache,reranker,llm,kiwix,nats \
#     off=hister,solver,otel
#
# `hister` and `solver` are off because both are separate services this file does
# not ship (see the notes at the bottom). `otel` is off because there is no
# collector here — set OTEL_EXPORTER_OTLP_ENDPOINT if you run one.
#
# PREREQUISITES — this rung does NOT work straight out of `up -d`:
#   - Ollama models. Pull them after first start, or search_and_summarize fails:
#       docker compose -f examples/compose.full.yml exec ollama ollama pull qwen3:4b
#       docker compose -f examples/compose.full.yml exec ollama ollama pull qwen3:14b
#   - Kiwix ZIM files in ./kiwix-data/ — https://download.kiwix.org/
#     Recommended: wikipedia_en_all_maxi, stackoverflow_en_all, archlinux_en_all.
#     kiwix-serve will not start against an empty directory.
#
# Container hardening (vikunja#693). Every setting below was verified by RUNNING
# the service, not by reading the diff — each row of the matrix was probed
# against a green no-hardening baseline first, because a comparison whose control
# is already failing tells you nothing. Two findings a diff read would have
# missed are recorded at their services: `cache` needs two capabilities back (or
# a uid), and three services need a writable /tmp.
#
# Network isolation (NE-02):
#   fetch-net      adblock-proxy + crawl4ai + searxng-mcp — the proxy is an open
#                  forward proxy with no auth, and must not be reachable from
#                  anything that does not need it
#   firecrawl-net  firecrawl-api + firecrawl-redis + firecrawl-playwright + searxng-mcp
#   (default)      searxng, cache, ollama, reranker, kiwix, nats, searxng-mcp
#
# searxng-mcp is the only service on all three, because it is the only one that
# has to talk to every tier.

# See rung 1's note: shared project name is deliberate (vikunja#694).
name: searxng-mcp

services:
  # ── SearXNG — the only hard requirement ─────────────────────────────────────
  searxng:
    image: docker.io/searxng/searxng:latest # SECURITY[accepted]: latest tag — example file; pin a digest for production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
    # NO cap_add. Measured 2026-09-07 against a green no-hardening baseline:
    # this image runs fine on `cap_drop: [ALL]` alone — container `running`,
    # `GET /` 200, and `?format=json` 200.
    #
    # An earlier draft of this file granted SETUID and SETGID here, reasoning by
    # analogy from `cache` and `firecrawl-redis` (whose entrypoints DO drop
    # privileges with setpriv and do need them). SearXNG's does not, and the
    # comment asserted a verification that had never been run. Two capabilities
    # were being handed to an adopter's container for no reason.
    #
    # The first attempt to check it was also wrong and is worth recording:
    # both arms failed identically with `"/etc/searxng/settings.yml" is not a
    # valid file` because no config was mounted. A comparison whose control is
    # already failing tells you nothing — mount ./searxng before re-testing.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0

  # ── Cache backend (Redis-compatible) ────────────────────────────────────────
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # Alternatives (drop-in compatible):
    #   image: redis:7-alpine
    #   image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Dragonfly's entrypoint drops privileges with setpriv, so with the image's
    # default (root) user a bare `cap_drop: [ALL]` kills it at startup with
    # "setpriv: setresuid failed: Operation not permitted" (exit 127) — the
    # finding that would have broken every adopter's cache had this block been
    # applied from a diff read.
    #
    # Running as uid 1000 removes the need for those capabilities entirely:
    # the drop is not attempted, so SETUID/SETGID are not granted. Verified
    # both ways.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:6381:6379"
    # --proactor_threads is not optional on a large host: Dragonfly sizes its
    # io threads to the core count and then refuses to start if maxmemory is
    # below 256MiB per thread. On a 32-core machine this exact command line
    # exits with "There are 32 threads, so 8.00GiB are required" before any
    # hardening is involved. Found by running it (vikunja#693).
    command: ["--proactor_threads=4", "--maxmemory=2gb", "--save_schedule="]
    ulimits:
      memlock: -1

  # ── Firecrawl (tier-1 JS-render fetch) ──────────────────────────────────────
  # Firecrawl requires its own Redis instance and the playwright-service sidecar.
  # See https://docs.firecrawl.dev/self-hosting for full setup.
  firecrawl-api:
    image: ghcr.io/mendableai/firecrawl:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    # No `user:`: image not available here to confirm its default user, so this
    # is UNVERIFIED rather than assumed safe — flagged for audit.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: NOT verified. This image is not published under a tag
    # that could be started without API keys, so it was never run under the
    # hardening. Absent rather than guessed — see the note at the top.
    mem_limit: 2g
    cpus: 2.0
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3003
      USE_DB_AUTHENTICATION: "false"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - firecrawl-redis
      - firecrawl-playwright
    networks:
      - firecrawl-net

  firecrawl-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # redis:7-alpine drops privileges with setpriv, exactly like Dragonfly, so
    # a bare `cap_drop: [ALL]` restart-loops it on
    # "setpriv: setresuid failed: Operation not permitted".
    #
    # This was initially recorded as verified against `redis:alpine` — a
    # DIFFERENT image (redis 8, different entrypoint) that happens to be the
    # one present on the build host. It passed, and the tag this file actually
    # declares did not. Every probe below is now run against the exact
    # reference in this file.
    # As with `cache`: running as uid 1000 means the setpriv drop is not
    # attempted, so SETUID/SETGID are not needed. Verified both ways.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - firecrawl-net

  firecrawl-playwright:
    # Custom build: ghcr.io/firecrawl/playwright-service + EasyList/EasyPrivacy
    # via @ghostery/adblocker-playwright. See docker/playwright-adblock/README.md
    # — and read its SSRF note before changing the route handler.
    #
    # Replaces the former puppeteer-based service, which layered adblocking onto
    # the v1 renderer (trieve/puppeteer-service-ts). This repo defaults to
    # FIRECRAWL_API_VERSION=v2, whose renderer is the playwright service — so
    # tier-1 adblocking did not apply to the configuration this project actually
    # runs (vikunja#696). docker/puppeteer-adblock/ is kept for adopters still on
    # v1 and is marked v1-only in its README.
    #
    # NOTE: the port is 3003, not 3000 — the two renderers differ.
    build:
      context: ../docker/playwright-adblock
    restart: unless-stopped
    # No `user:`: the base image already runs as `node` (non-root). Overriding
    # it with a guessed uid risks breaking file ownership inside the image.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: not verified — Chromium writes outside /tmp. Left off
    # rather than guessed.
    mem_limit: 2g
    cpus: 2.0
    environment:
      # ADBLOCK_FILTERS_URL is deliberately unset: the filter lists are baked
      # into the image, and setting this opts back into fetching them at
      # runtime — the switch defeated by its own default.
      # Set ADBLOCK_DISABLE=true to disable adblocking for debugging.
      ADBLOCK_DISABLE: "${ADBLOCK_DISABLE:-false}"
    networks:
      - firecrawl-net

  # ── Adblock proxy (tiers 2+3 HTTP proxy filter) ────────────────────────────
  # Routes Crawl4AI and raw Node fetch through a @ghostery/adblocker HTTP proxy.
  # Plain-HTTP ad/tracker requests are blocked with an empty 200 response.
  # HTTPS CONNECT is tunneled without MITM — see docker/adblock-proxy/README.md.
  # On fetch-net only — unreachable from firecrawl, ollama, reranker, kiwix, nats.
  # Port 8118 exposed to host so searxng-mcp (PM2/host process) can reach it.
  adblock-proxy:
    image: ghcr.io/tadmstr/searxng-mcp-adblock-proxy:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # To build from source instead of pulling:
    # build:
    #   context: ../docker/adblock-proxy
    restart: unless-stopped
    # No `user:`: the image's Dockerfile already sets `USER proxy` (non-root).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Verified running fully read-only.
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8118:8118"
    environment:
      ADBLOCK_FILTERS_URL: "https://easylist.to/easylist/easylist.txt,https://easylist.to/easylist/easyprivacy.txt"
      ADBLOCK_REFRESH_HOURS: "168"
      LOG_BLOCKED: "false"
    networks:
      - fetch-net

  # ── Crawl4AI (tier-2 fetch fallback) ────────────────────────────────────────
  crawl4ai:
    image: unclecode/crawl4ai:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    # No `user:`: the image already runs as `appuser` (non-root).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NO `read_only`. Three configurations were run, and none is fit for a file
    # adopters copy:
    #
    #   read_only + tmpfs /tmp
    #       gunicorn worker crash-loops to FATAL —
    #       OSError: [Errno 30] Read-only file system: '/home/appuser/.crawl4ai'
    #   read_only + tmpfs /tmp,/home/appuser/.crawl4ai
    #       healthy and serving, but still logs a read-only error for
    #       '/home/appuser/.gunicorn'
    #   read_only + tmpfs /tmp,/home/appuser
    #       no read-only errors at all, and the service is unhealthy and
    #       unreachable — masking the home directory hides something it needs
    #
    # Chasing writable paths one exception at a time is how you end up with a
    # container that logs clean and serves nothing, which is the third case.
    #
    # Note the first configuration reports `running` for roughly 30 seconds
    # before gunicorn gives up retrying. An earlier pass recorded it as
    # verified on a 12-second wait: "running" is not "working".
    mem_limit: 4g
    cpus: 4.0
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      # REQUIRED on crawl4ai 0.9.x — the server refuses unauthenticated
      # requests there, and searxng-mcp surfaces that as a tier-2 failure
      # rather than a config error. Must match searxng-mcp's copy below.
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
    shm_size: "1gb"
    networks:
      - fetch-net

  # ── Ollama (query expansion + summarization) ─────────────────────────────────
  # Required models: qwen3:4b (expand), qwen3:14b (summarize)
  # Pull after start: docker exec ollama ollama pull qwen3:4b && docker exec ollama ollama pull qwen3:14b
  ollama:
    image: ollama/ollama:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NO `read_only`, and not for lack of trying: verified failing both with
    # and without a tmpfs /tmp. Ollama writes outside /tmp, which is what the
    # ollama-data volume is for. This is the service the plan had in mind when
    # it said read_only is not a blanket addition.
    mem_limit: 8g
    cpus: 4.0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Reranker (ML cross-encoder reranking) ────────────────────────────────────
  # This repo's own reranker: CPU-only, no API key, model baked into the image
  # so there is no cold start. Source and contract in docker/reranker/.
  #
  # Alternatives, if you would rather run something else on port 8787:
  #   - Jina Reranker: docker pull jinaai/jina-reranker-v2-base-multilingual
  #   - Infinity with a cross-encoder model: https://github.com/michaelfeil/infinity
  #   - Any service exposing a Jina-compatible /v1/rerank
  reranker:
    image: ghcr.io/tadmstr/searxng-mcp-reranker:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # To build from source instead of pulling:
    # build: ../docker/reranker
    restart: unless-stopped
    # Matches docker/reranker/docker-compose.yml, which pins the same uid: the
    # image already runs as 10001, and naming it here means a `docker run` that
    # overrides the entrypoint cannot quietly regain root.
    user: "10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Matches docker/reranker/docker-compose.yml, which carries the same block
    # and the reasoning behind the tmpfs (FlashRank's default cache_dir).
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    ports:
      # Loopback-only: the reranker has no authentication.
      - "127.0.0.1:8787:8787"
    environment:
      - RERANKER_MODEL=ms-marco-MiniLM-L-12-v2

  # ── Kiwix (offline Wikipedia / Stack Overflow / Arch Wiki) ──────────────────
  # Requires ZIM files in ./kiwix-data/ — see https://download.kiwix.org/
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    # No `user:`: the image already runs as `user` (non-root).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No `read_only`: NOT verified. kiwix-serve needs a .zim corpus to start
    # and there was none to test against, so the probe never had a green
    # baseline to compare to. Unverified is left off, not assumed safe.
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8292:8080"
    volumes:
      - ./kiwix-data:/data
    command: /data/*.zim

  # ── NATS (event publishing) ──────────────────────────────────────────────────
  # Optional: set NATS_URL=nats://localhost:4222 in searxng-mcp env to enable.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Verified: read_only alone exits 1, read_only + a writable /tmp runs.
    # JetStream has no volume here so it uses temporary storage under /tmp and
    # says so on startup — fine for the reference stack, not for a deployment
    # that needs the stream to survive a restart.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:4222:4222"
    command: ["-js"]
    # For credential-based auth, mount a config file:
    # volumes:
    #   - ./nats.conf:/etc/nats/nats.conf:ro
    # command: ["-c", "/etc/nats/nats.conf"]

  # ── Hister (optional — browsing-history fast path) ──────────────────────────
  # Hister is a separate service (a browser-extension-fed history index), not
  # shipped in this compose. Run it separately, then point searxng-mcp at it via
  # HISTER_URL / HISTER_TOKEN (below). When both are set, fetch_url queries
  # Hister before the tier cascade and serves login-walled / JS-heavy pages
  # already rendered by the browser extension. Leave unset to disable (zero
  # overhead). See README "Hister (optional)".

  # ── searxng-mcp ─────────────────────────────────────────────────────────────
  searxng-mcp:
    image: ghcr.io/tadmstr/searxng-mcp:latest # SECURITY[accepted]: latest tag — example file; pin a version for production
    restart: unless-stopped
    depends_on:
      - searxng
      - cache
      - crawl4ai
      - reranker
      - firecrawl-api
      - ollama
    ports:
      # Loopback only — see rung 1. Remove the 127.0.0.1 prefix and
      # SEARXNG_MCP_AUTH_TOKEN stops being optional. At this rung the server can
      # reach Ollama, Firecrawl and an open forward proxy, so an unauthenticated
      # port here is worth considerably more to an attacker than at rung 1.
      - "127.0.0.1:3001:3001"
    # The only service on all three networks: it is the only one that has to
    # reach every tier. See the isolation note in the header.
    networks:
      - default
      - fetch-net
      - firecrawl-net
    environment:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_MCP_AUTH_TOKEN: "${SEARXNG_MCP_AUTH_TOKEN:-}"

      CACHE_URL: redis://cache:6379
      RERANKER_URL: http://reranker:8787
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"

      # ── Firecrawl — tier 1 ─────────────────────────────────────────────────
      FIRECRAWL_URL: http://firecrawl-api:3002
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-placeholder-local}"
      # SET EXPLICITLY, and it matters. FIRECRAWL_API_VERSION defaults to `v1`
      # in src/config.ts — deliberately, so an upgrade never silently changes
      # the live fetch path. But the renderer wired into this file is
      # firecrawl-playwright, which is the *v2* renderer, and the adblocking it
      # provides applies only on v2 (vikunja#696).
      #
      # Leave this unset and you get the v1 client talking to a v2 topology:
      # tier-1 adblocking silently does nothing, and PDFs (a v2-only capability)
      # do not work. The file must state the version it is actually built for
      # rather than relying on a default that points the other way.
      FIRECRAWL_API_VERSION: v2

      # ── Adblock proxy — tiers 2 and 3 ──────────────────────────────────────
      ADBLOCK_PROXY_URL: http://adblock-proxy:8118

      # ── LLM — query expansion and summarisation ────────────────────────────
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EXPAND_MODEL: qwen3:4b
      OLLAMA_SUMMARIZE_MODEL: qwen3:14b
      # Off by default: expansion costs an LLM round trip on EVERY search, and
      # it is a quality trade, not a free win. Turn it on and measure.
      EXPAND_QUERIES: "false"

      # ── Fast paths and fallbacks ───────────────────────────────────────────
      KIWIX_URL: http://kiwix:8080
      # Tier 4. Off everywhere below this rung; on here because the full stack
      # is the one that should exhaust every option before giving up.
      WAYBACK_ENABLED: "true"

      # ── Events ─────────────────────────────────────────────────────────────
      NATS_URL: nats://nats:4222
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 2.0

networks:
  fetch-net:
  firecrawl-net:

volumes:
  ollama-data:

# ── Orthogonal extras, deliberately NOT rungs ─────────────────────────────────
#
# These are not on the ladder because they are not "more of the same stack" —
# each is an independent axis you either need or do not.
#
# SOLVER (Byparr / FlareSolverr) — challenge-solving tier.
#   Buys you: pages behind Cloudflare-style interstitials, on the domains that
#   serve them. Only ever reached when a tier reports `challenge_detected`.
#   Costs you: another browser container, and a solver is a fetch path that
#   deliberately bypasses the public-address guard on its own address.
#   Enable: run one, then set SOLVER_URL and SOLVER_ENABLED=true on searxng-mcp.
#
# HISTER — browsing-history fast path.
#   A separate service (a browser-extension-fed history index), not shipped in
#   this repo. When HISTER_URL and HISTER_TOKEN are both set, fetch_url queries
#   it BEFORE the tier cascade and serves login-walled or JS-heavy pages already
#   rendered by the extension. Leave unset to disable, at zero overhead.
#
# OTEL — traces and metrics.
#   Set OTEL_EXPORTER_OTLP_ENDPOINT on searxng-mcp and point it at a collector.
#   No container here, because which collector you run is entirely your choice.
#
# ── MCP client configuration ──────────────────────────────────────────────────
#
# Point your MCP client at http://localhost:3001/mcp (streamable HTTP), sending
# SEARXNG_MCP_AUTH_TOKEN as `Authorization: Bearer <token>` if you set one.
#
# To run searxng-mcp on the host instead, drop the searxng-mcp service and use
# the loopback-published ports:
#
#   SEARXNG_URL             http://localhost:8081
#   CACHE_URL               redis://localhost:6381
#   FIRECRAWL_URL           http://localhost:3002
#   FIRECRAWL_API_VERSION   v2
#   FIRECRAWL_API_KEY       placeholder-local
#   CRAWL4AI_URL            http://localhost:11235
#   CRAWL4AI_API_TOKEN      <same value as above>
#   RERANKER_URL            http://localhost:8787
#   OLLAMA_URL              http://localhost:11434
#   OLLAMA_EXPAND_MODEL     qwen3:4b
#   OLLAMA_SUMMARIZE_MODEL  qwen3:14b
#   EXPAND_QUERIES          false
#   KIWIX_URL               http://localhost:8292
#   WAYBACK_ENABLED         true
#   ADBLOCK_PROXY_URL       http://localhost:8118
#   NATS_URL                nats://localhost:4222
#   CACHE_TTL_SECONDS       3600
#   FETCH_CACHE_TTL_SECONDS 86400
#   RERANK_RECENCY_WEIGHT   0.15
