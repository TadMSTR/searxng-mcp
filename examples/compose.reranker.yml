# ── RUNG 3 of 4 — reranker ────────────────────────────────────────────────────
#
# Rung 2 plus local ML reranking. THE BEST RANKING YOU CAN GET WITHOUT AN LLM,
# and the largest single quality jump in the ladder: results stop arriving in
# SearXNG's order and get reordered by a cross-encoder that actually reads the
# query against each result.
#
#   Containers   5  (rung 2's four, plus reranker)
#   RAM          ~8 GB total  (reranker capped at 2g below)
#   GPU          none — this is a CPU-only cross-encoder, deliberately
#   Disk         ~4 GB of images
#
# WHAT CHANGES FROM RUNG 2
#   `search` result order        now reranked by relevance, not SearXNG's order
#   `search`'s `min_score`       now DOES something — without a reranker there
#                                are no relevance scores to filter on, and the
#                                parameter is a documented no-op that says so
#   `search_and_fetch`           fetches a better top result, same mechanism
#   everything else              unchanged from rung 2
#
# No API key, no GPU, and no cold start — the model is baked into the image, and
# the published-image smoke test asserts that by running it with `--network none`
# (.github/workflows/docker-publish.yml). If the pre-bake ever silently stopped
# working, that test fails rather than turning into a 30-60s first-request stall.
#
# THE CAPABILITY LINE THIS RUNG PRINTS — measured 2026-09-07:
#
#   capabilities on=tier3 unverified=tier2,cache,reranker \
#     off=tier1,llm,kiwix,hister,solver,wayback,otel,nats
#
# The ONLY difference from rung 2 is `reranker` moving from `off` to
# `unverified`, and that is only legible because rung 2 explicitly sets
# RERANKER_URL="". Nothing probes at startup, so `unverified` here means "a
# reranker is configured and nobody has called it yet" — not a warning.
#
# HOW TO TELL THE RERANKER IS ACTUALLY WORKING, since the line will not tell you:
#   docker compose -f examples/compose.reranker.yml logs searxng-mcp | grep reranker
# Silence is good. A line reading `reranker unavailable — using SearXNG result
# order: <reason>` is the degradation notice, and it is throttled, so one line
# does not mean one failed search.
#
# MOVING UP A RUNG
#   Add Firecrawl, Ollama, Kiwix, NATS and the adblock proxy
#   → examples/compose.full.yml (rung 4).

# See rung 1's note: shared project name is deliberate (vikunja#694).
name: searxng-mcp

services:
  # ── Unchanged from rung 1 ───────────────────────────────────────────────────
  searxng:
    image: docker.io/searxng/searxng:latest # SECURITY[accepted]: latest tag — example file; pin a digest for production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]   # entrypoint drops privileges; see rung 1
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0

  # ── NEW: cache backend ──────────────────────────────────────────────────────
  # The single largest latency win in the whole stack, and the reason this rung
  # exists rather than starting at Crawl4AI alone.
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # Drop-in compatible alternatives, if you already run one:
    #   image: redis:7-alpine
    #   image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Dragonfly's entrypoint drops privileges with setpriv, so with the image's
    # default (root) user a bare `cap_drop: [ALL]` kills it at startup with
    # "setpriv: setresuid failed: Operation not permitted" (exit 127).
    # Running as uid 1000 removes the need entirely: the drop is not attempted,
    # so SETUID/SETGID are never required. Verified both ways (vikunja#693).
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    # --proactor_threads is not optional on a large host: Dragonfly sizes its io
    # threads to the core count and then refuses to start if maxmemory is below
    # 256MiB per thread. On a 32-core machine the same command line without it
    # exits with "There are 32 threads, so 8.00GiB are required", before any
    # hardening is involved. Found by running it (vikunja#693).
    command: ["--proactor_threads=4", "--maxmemory=2gb", "--save_schedule="]
    ulimits:
      memlock: -1
    ports:
      # Loopback publish so a host-run searxng-mcp (npx) can use this cache too.
      # Container-to-container traffic goes over the compose network and does
      # not need it. 6381 rather than 6379 to stay clear of a system Redis.
      - "127.0.0.1:6381:6379"

  # ── NEW: Crawl4AI — fetch tier 2 ────────────────────────────────────────────
  crawl4ai:
    image: unclecode/crawl4ai:latest # SECURITY[accepted]: latest tag — example file; pin for production
    restart: unless-stopped
    # No `user:`: the image already runs as `appuser` (non-root).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NO `read_only`, and this is a measured decision, not an omission. Three
    # configurations were run and none is fit for a file adopters copy:
    #
    #   read_only + tmpfs /tmp
    #       gunicorn worker crash-loops to FATAL —
    #       OSError: [Errno 30] Read-only file system: '/home/appuser/.crawl4ai'
    #   read_only + tmpfs /tmp,/home/appuser/.crawl4ai
    #       healthy and serving, but still logs a read-only error for
    #       '/home/appuser/.gunicorn'
    #   read_only + tmpfs /tmp,/home/appuser
    #       no read-only errors at all — and unhealthy and unreachable, because
    #       masking the home directory hides something it needs
    #
    # Chasing writable paths one exception at a time is how you get the third
    # case: a container that logs clean and serves nothing.
    #
    # The first configuration reports `running` for ~30 seconds before gunicorn
    # gives up retrying. An earlier pass recorded it as verified on a 12-second
    # wait. "running" is not "working".
    mem_limit: 4g
    cpus: 4.0
    # Loopback publish is for debugging only — searxng-mcp reaches it by
    # container name over the compose network, not through the host.
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      # REQUIRED on crawl4ai 0.9.x — the server refuses unauthenticated requests
      # there, and searxng-mcp surfaces that as a tier-2 failure rather than a
      # config error. Set it here AND as CRAWL4AI_API_TOKEN on searxng-mcp
      # below; the two must match.
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
    # Chromium needs more than the default 64 MB of shared memory or it will
    # crash on content-heavy pages.
    shm_size: "1gb"


  # ── NEW: reranker — local cross-encoder ─────────────────────────────────────
  # This repo's own reranker: CPU-only, no API key, model baked into the image.
  # Source and request/response contract in docker/reranker/.
  #
  # Alternatives, if you would rather run something else on port 8787:
  #   - Jina Reranker: jinaai/jina-reranker-v2-base-multilingual
  #   - Infinity with a cross-encoder model: https://github.com/michaelfeil/infinity
  #   - Anything exposing a Jina-compatible /v1/rerank
  reranker:
    image: ghcr.io/tadmstr/searxng-mcp-reranker:latest # SECURITY[accepted]: latest tag — example file; pin for production
    # To build from source instead of pulling:
    # build: ../docker/reranker
    restart: unless-stopped
    # The image already runs as 10001; naming it here means a `docker run` that
    # overrides the entrypoint cannot quietly regain root. Matches
    # docker/reranker/docker-compose.yml, which pins the same uid.
    user: "10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Verified running fully read-only. The tmpfs is for FlashRank's default
    # cache_dir — see docker/reranker/docker-compose.yml, which carries the same
    # block and the same reasoning.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2.0
    ports:
      # Loopback-only, and this one is not merely convention: the reranker has
      # NO AUTHENTICATION of any kind. Anything that can reach 8787 can use it.
      - "127.0.0.1:8787:8787"
    environment:
      - RERANKER_MODEL=ms-marco-MiniLM-L-12-v2

  # ── searxng-mcp ─────────────────────────────────────────────────────────────
  searxng-mcp:
    image: ghcr.io/tadmstr/searxng-mcp:latest # SECURITY[accepted]: latest tag — example file; pin a version for production
    restart: unless-stopped
    depends_on:
      - searxng
      - cache
      - crawl4ai
      - reranker
    ports:
      # Loopback only — see rung 1. Remove the 127.0.0.1 prefix and
      # SEARXNG_MCP_AUTH_TOKEN stops being optional.
      - "127.0.0.1:3001:3001"
    environment:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_MCP_AUTH_TOKEN: "${SEARXNG_MCP_AUTH_TOKEN:-}"

      # NEW at this rung.
      CACHE_URL: redis://cache:6379
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"

      # Still off: no Firecrawl at this rung, and FIRECRAWL_URL defaults to
      # http://localhost:3002, so without this every fetch attempts a dead tier 1
      # first and books the failure into the domain capability database — which
      # then routes around a tier that was never broken, only absent.
      FIRECRAWL_ENABLED: "false"

      # NEW at this rung — the whole point of it.
      RERANKER_URL: http://reranker:8787
    # The image's own healthcheck is correct from this rung up: a cache IS
    # deployed, so /health returning 503 means something is genuinely wrong.
    # Rung 1 has to override it; this one deliberately does not.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 2.0

# ── MCP client configuration ──────────────────────────────────────────────────
#
#   SEARXNG_URL          http://localhost:8081
#   CACHE_URL            redis://localhost:6381    # if running searxng-mcp on the host
#   CRAWL4AI_URL         http://localhost:11235
#   CRAWL4AI_API_TOKEN   <same value as above>
#   RERANKER_URL         http://localhost:8787
#   FIRECRAWL_ENABLED    false
